<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>用 iPhone 相機掃描此 QR Code 立即體驗</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center p-6 font-sans">
  <div class="bg-white border-4 border-[#9A3412] rounded-3xl p-8 max-w-lg w-full text-center shadow-2xl space-y-6">
    <div class="text-5xl">📱🍲</div>
    <h1 class="text-3xl font-black text-[#9A3412]">請拿 iPhone 相機掃描下方 QR Code</h1>
    <p class="text-xl text-stone-700 font-bold">
      已為您建立專屬 HTTPS 安全連線，不用連同一個 Wi-Fi（用 4G/5G 也可以）都能直接打開！
    </p>
    <div class="flex justify-center">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=https://e1e42c55f40c40.lhr.life"
        alt="手機連線 QR Code"
        class="w-64 h-64 border-4 border-stone-800 rounded-2xl p-2 bg-white shadow"
      />
    </div>
    <div class="bg-stone-100 p-4 rounded-2xl border-2 border-stone-300 space-y-1">
      <p class="text-lg font-bold text-stone-600">或直接在手機輸入網址：</p>
      <a href="https://e1e42c55f40c40.lhr.life" target="_blank" class="text-2xl font-black text-[#9A3412] underline break-all">
        https://e1e42c55f40c40.lhr.life
      </a>
    </div>
    <div class="pt-2">
      <a href="http://127.0.0.1:8080" class="inline-block w-full py-4 bg-[#9A3412] text-white font-extrabold text-2xl rounded-2xl shadow">
        👉 在電腦上直接預覽 App
      </a>
    </div>
  </div>
</body>
</html>
